name: Research Job Scheduler

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotword-research-job
  cancel-in-progress: false

jobs:
  run-next-research-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run next pending research job
        id: research_job
        continue-on-error: true
        env:
          RESEARCH_CALLBACK_URL: ${{ secrets.RESEARCH_CALLBACK_URL }}
          RESEARCH_CALLBACK_TOKEN: ${{ secrets.RESEARCH_CALLBACK_TOKEN }}
        run: python3 run_next_research_job.py

      - name: Check for research job outputs
        id: research_outputs
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- jobs/ || true)"
          if [ -z "$status" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new research outputs under jobs/; skip artifact upload"
            exit 0
          fi

          echo "Detected changes under jobs/:"
          printf '%s\n' "$status"

          dirs_file="$(mktemp)"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            if [[ "$path" == *" -> "* ]]; then
              path="${path##* -> }"
            fi
            path="${path#\"}"
            path="${path%\"}"
            case "$path" in
              jobs/batches/*)
                continue
                ;;
              jobs/*/*|jobs/*)
                job_id="${path#jobs/}"
                job_id="${job_id%%/*}"
                if [ -z "$job_id" ] || [ "$job_id" = "$path" ]; then
                  echo "ERROR: unexpected path under jobs/: $path" >&2
                  exit 1
                fi
                printf 'jobs/%s\n' "$job_id" >> "$dirs_file"
                ;;
              *)
                echo "ERROR: unexpected path under jobs/: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$status"

          unique="$(sort -u "$dirs_file")"
          rm -f "$dirs_file"
          n="$(printf '%s\n' "$unique" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$n" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No job directories resolved; skip artifact upload"
          elif [ "$n" -eq 1 ]; then
            job_dir="$unique"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "job_dir=$job_dir" >> "$GITHUB_OUTPUT"
            echo "Single changed job dir: $job_dir"
          else
            echo "ERROR: multiple job directories changed; refusing to mix artifacts:" >&2
            printf '%s\n' "$unique" >&2
            exit 1
          fi

      - name: Upload research results artifact
        if: steps.research_outputs.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: research-results-${{ github.run_id }}
          path: |
            ${{ steps.research_outputs.outputs.job_dir }}/job.json
            ${{ steps.research_outputs.outputs.job_dir }}/status.json
            ${{ steps.research_outputs.outputs.job_dir }}/research_result.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload batch receipt
        if: always() && steps.research_job.outputs.receipt_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: batch-receipt-${{ github.run_id }}
          path: ${{ steps.research_job.outputs.receipt_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish batch summary
        if: always() && steps.research_job.outputs.receipt_path != ''
        env:
          RECEIPT_PATH: ${{ steps.research_job.outputs.receipt_path }}
        run: |
          python3 -c 'import json, os; print(json.load(open(os.environ["RECEIPT_PATH"], encoding="utf-8"))["summary"])' >> "$GITHUB_STEP_SUMMARY"

      - name: Propagate research job failure
        if: steps.research_job.outcome == 'failure'
        run: |
          echo "Research job failed; artifacts have been preserved."
          exit 1

  run-next-game-wide-discovery-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run next pending GAME_WIDE discovery job
        id: game_wide_job
        continue-on-error: true
        env:
          RESEARCH_CALLBACK_URL: ${{ secrets.RESEARCH_CALLBACK_URL }}
          RESEARCH_CALLBACK_TOKEN: ${{ secrets.RESEARCH_CALLBACK_TOKEN }}
        run: python3 run_next_game_wide_discovery_job.py

      - name: Check for GAME_WIDE job outputs
        id: game_wide_outputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t job_dirs < <(
            git status --porcelain -- jobs/ |
              sed -nE 's/^.. ?"?jobs\/([^/]+).*/jobs\/\1/p' |
              sort -u
          )

          if [ "${#job_dirs[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new GAME_WIDE outputs under jobs/; skip artifact upload"
            exit 0
          fi
          if [ "${#job_dirs[@]}" -ne 1 ]; then
            echo "ERROR: multiple GAME_WIDE job directories changed; refusing to mix artifacts:" >&2
            printf '%s\n' "${job_dirs[@]}" >&2
            exit 1
          fi

          job_dir="${job_dirs[0]}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "job_dir=$job_dir" >> "$GITHUB_OUTPUT"
          echo "Single GAME_WIDE job dir: $job_dir"

      - name: Upload GAME_WIDE research results artifact
        if: steps.game_wide_outputs.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: game-wide-research-results-${{ github.run_id }}
          path: |
            ${{ steps.game_wide_outputs.outputs.job_dir }}/job.json
            ${{ steps.game_wide_outputs.outputs.job_dir }}/status.json
            ${{ steps.game_wide_outputs.outputs.job_dir }}/game_wide_social_result.json
            ${{ steps.game_wide_outputs.outputs.job_dir }}/research_pack.json
          retention-days: 30
          if-no-files-found: error

      - name: Propagate GAME_WIDE job failure
        if: steps.game_wide_job.outcome == 'failure'
        run: |
          echo "GAME_WIDE research job failed; artifacts have been preserved."
          exit 1
